name: AI Natural-Language Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-deterministic by nature (the model decides each action live),
    # so this job is informational and does not block merges by default.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run AI-driven tests
        run: npm run test:ai
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          API_URL: ${{ secrets.API_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_TESTS_BLOCKING: 'false'

      - name: Upload AI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-results
          path: ai-test-results/
          retention-days: 14